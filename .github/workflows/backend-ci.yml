name: CI

on:
  push:
  pull_request:
    branches: [ main, dev ]

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: Install dependencies
      run: |
        cd backend
        uv sync --dev

    - name: Run ruff check
      run: |
        cd backend
        uv run ruff check . --fix

    - name: Run ruff format check
      run: |
        cd backend
        uv run ruff format --check .

    - name: Run mypy
      run: |
        cd backend
        uv run mypy .
